name: Csound plugins build

env:
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop

jobs:
  build_package:
    runs-on: ${{ matrix.os }}

    env:
      CSOUND_VERSION: 6.17.2

    strategy:
      matrix:
        os: [windows-latest]
        version: ["6.17.0"]
        include:
          - os: "windows-latest"
            mono: ""
          # - os: "ubuntu-latest"
          #   mono: "mono"
          # - os: "macos-latest"
          #   mono: "mono"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v1
        with:
          fetch-depth: 1
          submodules: true

      - name: Setup platform (windows)
        if: startsWith(matrix.os, 'windows')
        env:
          FAUST_URL: https://github.com/grame-cncm/faust/releases/download/2.60.3/Faust-2.60.3-win64.exe
        run: |
          Invoke-WebRequest $env:FAUST_URL -OutFile faustInstaller.exe
          ./faustInstaller.exe /S
          echo "C:/Program Files/csound/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "OPCODE6DIR64=C:/Program Files/csound/plugins64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PYTHONPATH=C:/Program Files/csound/bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "RAWWAVE_PATH=C:/Program Files/csound/samples" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          .\6.x\vcpkg\bootstrap-vcpkg.bat
          choco install csound --version=6.17.0
          echo $GITHUB_ENV
          ls 'C:\Program Files\Faust\'
          echo "C:\Program Files\Faust\;C:\Program Files\Faust\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # vcpkg's pinned baseline downloads pkgconf from MSYS2 mirrors, which
          # can be unavailable/removed upstream and break the build before it
          # even reaches our ports. Provide a pkg-config via chocolatey and
          # point vcpkg at it (vcpkg_find_acquire_program short-circuits its
          # own download when PKG_CONFIG is already set) so eigen3/fltk/etc.
          # configuration no longer depends on that MSYS2 mirror.
          choco install pkgconfiglite -y
          echo "PKG_CONFIG=C:\ProgramData\chocolatey\bin\pkg-config.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        # - name: Setup platform (linux)
        #   if: startsWith(matrix.os, 'ubuntu')
        #   run: |
        #     ./vcpkg/bootstrap-vcpkg.sh
        #     sudo apt-get update
        #     sudo apt-get install libcsound64-dev

        # - name: Setup platform (macos)
        #   if: startsWith(matrix.os, 'macos')
        #   run: |
        #     ./vcpkg/bootstrap-vcpkg.sh
        #     brew install csound

      - name: Setup VCPKG cache
        shell: bash
        run: |
          ${{ matrix.mono }} `./6.x/vcpkg/vcpkg fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/csound/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "csound" \
          -password "${{ secrets.GITHUB_TOKEN }}"
          ${{ matrix.mono }} `./6.x/vcpkg/vcpkg fetch nuget | tail -n 1` \
            setapikey "${{ secrets.GITHUB_TOKEN }}" \
            -source "https://nuget.pkg.github.com/csound/index.json"

      - name: Generate CMake build
        run: cmake 6.x/. -B build -DUSE_VCPKG=1 -DBUILD_ABLETON_LINK_OPCODES=OFF

      - name: Verify ableton-link is not installed by vcpkg
        shell: bash
        run: |
          matches=""
          if [ -d build/vcpkg_installed ]; then
            matches=$(find build/vcpkg_installed -maxdepth 2 -iname "ableton-link*")
          fi
          if [ -n "$matches" ]; then
            echo "ableton-link was installed by vcpkg even though BUILD_ABLETON_LINK_OPCODES=OFF" >&2
            echo "$matches" >&2
            exit 1
          fi
          echo "Confirmed ableton-link is not part of the vcpkg install graph."

      - name: Build plugins
        run: cmake --build build --config Release

      - name: Build installer
        run: iscc /o. .\installer\win64\Installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Csound_win_x64-${{env.CSOUND_VERSION}}.${{github.run_number}}-plugins-installer
          path: ./csound6-plugins-win_x86_64-*.exe
          if-no-files-found: error
