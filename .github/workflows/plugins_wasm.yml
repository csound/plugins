name: Csound 7 WASM plugins

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      # csound/csound#3416 must land and ship before this package can publish.
      - uses: actions/checkout@v7.0.1
        with:
          repository: csound/csound
          ref: aed14beaa392dfe9c12270abd9cd63e57651be06
          path: .csound
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: cachix/install-nix-action@v31.11.1
      - uses: cachix/cachix-action@v17
        with:
          name: csound
      - name: Install JS dependencies
        run: npm ci
      - name: Build WASM plugins with CMake and Nix
        run: npm run build
      - name: Build the required Csound runtime
        run: |
          npm run build:runtime
          echo "CSOUND_BROWSER_URL=file://$GITHUB_WORKSPACE/.csound/platform/wasm-wasi/browser/dist/csound.js" >> "$GITHUB_ENV"
      - name: Test and pack
        run: npm pack
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: csound-plugins-npm
          path: csound-plugins-*.tgz
          if-no-files-found: error
