name: Csound 7 WASM plugins

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CSOUND_WASM_PACKAGE: ${{ github.workspace }}/.csound/platform/wasm-wasi
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: cachix/install-nix-action@v31.11.1
      - uses: cachix/cachix-action@v17
        with:
          name: csound
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      # Depends on csound/csound#3556. Replace this checkout with published
      # package pins once the matching browser and wasm-bin releases exist.
      - uses: actions/checkout@v7.0.1
        with:
          repository: hlolli/csound
          ref: 623c6e8fa1f76ed02fc74dfe178061e7b6ef7aec
          path: .csound
          persist-credentials: false
      - name: Build the upstream Preview 2 engines and SDKs
        run: bash wasm/scripts/prepare-csound.sh
      - name: Install JS dependencies
        run: npm ci
      - name: Build WASM plugins with CMake and Nix
        run: npm run build
      - name: Test and pack
        run: npm pack
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: csound-plugins-npm
          path: csound-plugins-*.tgz
          if-no-files-found: error
